<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e3f2fd;
        }

        .login {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Login</h1>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

        <a href="#">Forgot Password?</a>

    </div>

</body>
</html>
